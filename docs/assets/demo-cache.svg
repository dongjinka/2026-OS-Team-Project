<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <defs>
    <style>
      .win{fill:#0d1117;stroke:#30363d;stroke-width:1}
      .bar{fill:#161b22}
      .t{font-size:14px}
      .prompt{fill:#58a6ff}
      .user{fill:#c9d1d9}
      .dim{fill:#8b949e}
      .cap{fill:#8b949e;font-size:11px}
      .ans{fill:#c9d1d9;font-size:14px}
      .chip{fill:#161b22;stroke:#30363d;stroke-width:1}
      .acc{fill:#3fb950}
      .hitpill{fill:#2d2206;stroke:#9e6a03;stroke-width:1}
      .hit{fill:#e3b341;font-size:13px}
    </style>
  </defs>

  <!-- window -->
  <rect class="win" x="2" y="2" width="756" height="296" rx="10"/>
  <rect class="bar" x="2" y="2" width="756" height="32" rx="10"/>
  <rect class="bar" x="2" y="18" width="756" height="16"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <text x="380" y="22" text-anchor="middle" class="cap">xv6 LLM agent · solar-pro2</text>

  <!-- turn 1 -->
  <text x="24" y="66" class="t"><tspan class="prompt">you ▸ </tspan><tspan class="user">11 + 22가 얼마인지 알려줘</tspan></text>
  <rect class="chip" x="24" y="80" width="320" height="36" rx="8"/>
  <rect class="acc" x="24" y="80" width="4" height="36" rx="2"/>
  <text x="40" y="95" class="cap">answer</text>
  <text x="40" y="108" class="ans">11 + 22는 33입니다</text>

  <!-- turn 2: exact repeat -> cache hit -->
  <text x="24" y="156" class="t"><tspan class="prompt">you ▸ </tspan><tspan class="user">11 + 22가 얼마인지 알려줘</tspan><tspan class="dim">   ← 동일 요청 재호출</tspan></text>
  <rect class="hitpill" x="24" y="170" width="118" height="26" rx="13"/>
  <text x="38" y="188" class="hit">[cache HIT]</text>
  <text x="152" y="188" class="dim t">answer reused from kernel F9 cache — Solar not called</text>
  <rect class="chip" x="24" y="208" width="320" height="36" rx="8"/>
  <rect class="acc" x="24" y="208" width="4" height="36" rx="2"/>
  <text x="40" y="223" class="cap">answer</text>
  <text x="40" y="236" class="ans">11 + 22는 33입니다</text>

  <text x="24" y="278" class="dim" font-size="12px">반복 지식 질의는 커널 캐시에서 응답 — LLM API 왕복 1회 절약</text>
</svg>
